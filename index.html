<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Document</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .form-container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #4a90e2;
        }

        button {
            padding: 10px 18px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #357ab8;
        }

        .member-card {
            background: #fff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 320px;
        }

        .member-card h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 8px;
        }

        .member-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }

        .member-item {
            padding: 8px 10px;
            margin-bottom: 6px;
            background-color: #f0f4f8;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .member-item:hover {
            background-color: #dbeafe;
        }

        .total {
            margin-top: 15px;
            font-weight: bold;
            color: #4a90e2;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <input id="first_name" placeholder="First Name">
        <input id="last_name" placeholder="Last Name">
        <button py-click="add_member">Add Member</button>
    </div>
    <div id="output"></div>
    <py-script src="main.py"></py-script>
</body>
</html>
